name: basicmnist
dataset: mnist


optimizer:
  type: rmsprop
  learning_rate: 0.1

layers:
  - type: input

  - type: hidden
    dropout: 0.2
    nodes: 256
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

seed: 42

weight: he
epochs: 10
valid_freq: 1
batch_size: 512
