name: basicmnist
dataset: mnist

dataset_args:
  elastic_deform:
    alpha: 34
    sigma: 4
    variants: 5

optimizer:
  type: adam
  learning_rate: 0.1

layers:
  - type: input

  - type: hidden
    nodes: 256
    dropout: 0.2
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: softmax
    loss: onehot
    metric: accuracy

seed: 42

weight: he
epochs: 50
valid_freq: 1
batch_size: 512
