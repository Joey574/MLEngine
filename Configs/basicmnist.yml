name: basicmnist
dataset: mnist

optimizer:
  type: adam
  learning_rate: 1.0

layers:
  - type: input
    weight: he
    nodes: 784

  - type: hidden
    weight: he
    nodes: 256
    dropout: 0.2
    activation: leakyrelu

  - type: output
    weight: he
    nodes: 10
    activation: softmax
    loss: onehot
    metric: accuracy

seed: 42

epochs: 500
valid_freq: 1
batch_size: 512
