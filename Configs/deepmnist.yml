name: deepmnist
dataset: mnist

dataset_args:
  rotation: 15
  rot_variants: 5

weight: he

layers:
  - type: input

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: hidden
    nodes: 32
    activation: leakyrelu
    skipconn: 0

  - type: hidden
    nodes: 32
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 100
valid_freq: 1
learning_rate: 0.005
batch_size: 512