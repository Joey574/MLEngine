name: smallmnist
dataset: mnist

optimizer:
  type: adam
  learning_rate: 0.2

weight: he

layers:
  - type: input


  - type: hidden
    nodes: 128
    activation: leakyrelu

  - type: hidden
    nodes: 128
    activation: leakyrelu


  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 100
valid_freq: 1
batch_size: 512