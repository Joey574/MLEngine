name: smallmnist
dataset: mnist

optimizer:
  type: adam
  learning_rate: 0.1

weight: he

layers:
  - type: input
    nodes: 784

  - type: hidden
    nodes: 128
    activation: leakyrelu

  - type: hidden
    nodes: 128
    activation: leakyrelu


  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 1000
valid_freq: 1
batch_size: 512
