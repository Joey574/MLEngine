name: smallmandle
dataset: mandlebrot

dataset_args:
  samples: 100000
  mandledepth: 500
  fourier_series: 64

optimizer:
  type: rmsprop
  learning_rate: 0.001

weight: he

layers:
  - type: input

  - type: hidden
    nodes: 512
    dropout: 0.2
    activation: leakyrelu

  - type: hidden
    nodes: 512
    dropout: 0.2
    activation: leakyrelu

  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

epochs: 1000
valid_freq: 1
batch_size: 512