name: smallmandle
dataset: mandlebrot

dataset_args:
  samples: 100000
  mandledepth: 250

  uniform_percent: 0.5
  fourier_series: 8

  image_width: 1920
  image_height: 1080

optimizer:
  type: adam
  learning_rate: 0.01

layers:
  - type: input

  - type: hidden
    nodes: 512
    activation: leakyrelu

  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

seed: 101
weight: he
epochs: 10000
valid_freq: 1
batch_size: 512
