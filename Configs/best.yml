name: bestmnist
dataset: mnist

dataset_args:
  rotation: 15
  rot_variants: 10
  scale: 0.2
  scale_variants: 5

weight: he

layers:
  - type: input

  - type: hidden
    dropout: 0.3
    nodes: 1024
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 1000
valid_freq: 1
learning_rate: 0.0005
batch_size: 512