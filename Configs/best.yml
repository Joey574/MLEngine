name: bestmnist
dataset: mnist

dataset_args:
  rotation: 15
  rot_per_sample: 10

weight: he

layers:
  - type: input

  - type: hidden
    dropout: 0.3
    nodes: 1024
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 1000
valid_freq: 1
learning_rate: 0.001
batch_size: 512