name: bestmnist
dataset: mnist

dataset_args:
  rotation: 15
  rot_variants: 10

optimization:
  type: rmsprop
  learning_rate: 0.001

weight: he

layers:
  - type: input

  - type: hidden
    dropout: 0.3
    nodes: 1024
    activation: leakyrelu

  - type: output
    nodes: 10
    activation: sigmoid
    loss: onehot
    metric: accuracy

epochs: 1000
valid_freq: 1
batch_size: 512