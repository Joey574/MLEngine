name: bigmandle
dataset: mandlebrot

optimizer:
  type: adam
  learning_rate: 0.0001

dataset_args:
  augment_refresh_interval: 100
  dump_raw_dataset: true

  samples: 1500000
  mandledepth: 10000
  uniform_percent: 0.1

  quad_tree: true
  quad_depth: 6

  jump_eqs: 0.0

  x_resolution: 16384
  y_resolution: 4096

  fourier_series: 64
  image_width: 2560
  image_height: 1440

weight: he

layers:
  - type: input

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

epochs: 10000
valid_freq: 1
batch_size: 32768
