name: bigmandle
dataset: mandlebrot

optimizer:
  type: adam
  learning_rate: 0.0001

dataset_args:
  augment_refresh_interval: 25
  dump_raw_dataset: true

  samples: 1000000
  mandledepth: 10000
  uniform_percent: 0.1

  quad_tree: true
  leaf_dim: 8
  min_quad_depth: 16

  x_resolution: 65356
  y_resolution: 32678

  jump_eqs: 0.0

  fourier_series: 64
  image_width: 2000
  image_height: 2000

weight: he

layers:
  - type: input

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    activation: leakyrelu

  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

epochs: 10000
valid_freq: 1
batch_size: 32768
