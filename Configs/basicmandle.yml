name: basicmandle
dataset: mandlebrot

dataset_args:
  samples: 250000
  mandledepth: 500
  fourier_series: 16

  image_width: 1920
  image_height: 1080

optimizer:
  type: adam
  learning_rate: 0.001

layers:
  - type: input

  - type: hidden
    nodes: 512
    activation: leakyrelu

  - type: hidden
    nodes: 512
    activation: leakyrelu

  - type: hidden
    nodes: 512
    activation: leakyrelu

  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

#seed: 2539531789

weight: he
epochs: 100000
valid_freq: 1
batch_size: 2048
