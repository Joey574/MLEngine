name: basicmandle
dataset: mandlebrot

dataset_args:
  samples: 250000
  mandledepth: 500
  fourier_series: 32

optimizer:
  type: adam
  learning_rate: 0.005


layers:
  - type: input


  - type: hidden
    nodes: 1024
    dropout: 0.3
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    dropout: 0.3
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    dropout: 0.3
    activation: leakyrelu

  - type: hidden
    nodes: 1024
    dropout: 0.3
    activation: leakyrelu


  - type: output
    nodes: 1
    activation: sigmoid
    loss: mse
    metric: mae

seed: 2539531789

weight: he
epochs: 100000
valid_freq: 1
batch_size: 1024